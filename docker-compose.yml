services:
  # ─────────────────────────────────────────────────────
  # NGINX - Reverse Proxy + Frontend Static Files
  # Builds React app and serves it, plus proxies /api/ to backend
  # ─────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: oss-nginx
    ports:
      - "91:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - oss-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────
  # BACKEND - Express.js API Server
  # ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: oss-backend
    environment:
      - DB_HOST=mysql
      - DB_USER=backend
      - DB_PASSWORD=${DB_PASSWORD:-backendpass}
      - DB_NAME=rh_app
      - DB_PORT=3306
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET}
      - OUTLOOK_TENANT_ID=${OUTLOOK_TENANT_ID}
      - OUTLOOK_USER_EMAIL=${OUTLOOK_USER_EMAIL}
      - OPENROUTER_API_KEY=
      - OPENROUTER_MODEL=openai/gpt-oss-120b:free
      - NODE_ENV=production
    volumes:
      # Persistent file storage
      - ./files:/app/files
      - ./archives:/app/archives
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oss-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/offers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────
  # MYSQL - Database
  # Only accessible internally via oss-network
  # ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: oss-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass123}
      - MYSQL_DATABASE=rh_app
      - MYSQL_USER=backend
      - MYSQL_PASSWORD=${DB_PASSWORD:-backendpass}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oss-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-oss_password_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports exposed - only internal access

# ─────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: oss-mysql-data

# ─────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────
networks:
  oss-network:
    name: oss-network
    driver: bridge
